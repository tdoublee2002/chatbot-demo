[project]
name = "agentic-rag-backend"
version = "0.1.0"
description = "FastAPI backend for Agentic RAG MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "openai>=1.40.0",
  "supabase>=2.6.0",
  "python-dotenv>=1.0.1",
  "pypdf>=4.3.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
